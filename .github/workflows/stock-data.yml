name: Update Stock Data (Parts)

# One daily job for every screener list (v4.9.0). The master universe is split
# into parts of up to 500 stocks by build_universe.py; this workflow fetches one
# part per matrix leg, so a stock held by four lists is fetched once a day
# instead of four times (measured 2026-09-28: 932 fetches a day for 629 unique
# tickers). The per-list feeds the site reads are then derived from the parts by
# build_legacy_feeds.py, with no further Yahoo calls.
#
# Two schedules, split by how fast the data actually moves (owner decision
# 2026-09-29). The DAILY run covers only the parts the seven curated universes
# live in, about 1,000 symbols in one wave, because price, prevClose and
# changePct are daily by nature and v4.4.0's score history wants a point a day.
# The WEEKLY run covers every part, about 3,575 symbols, because the whole-market
# tail is a research pool whose fundamentals move quarterly.
#
# This replaced the four per-list feed workflows (screener-data.yml, -sp500,
# -gvd, -intl), deleted in the same commit; the ETFs job stays, since ETF records
# share only 7 of their 20 fields with stock records and score on a different
# model. Reverting that commit brings the four back, which is the rollback.
#
# Why a push retry loop rather than one collect-and-commit job: `concurrency`
# is workflow-level, so the matrix legs do NOT get the serialization the five
# old workflows relied on, and git rejects a non-fast-forward push whatever
# paths it touches. Parts committing separately keeps part 1 (the default view)
# freshest, which a single collecting commit would lose.

on:
  schedule:
    # Daily, the curated universes only. 21:37 UTC Mon-Fri, inherited unchanged
    # from the Nasdaq 100 job this replaced: 30 minutes after the LATEST possible
    # US close in UTC terms (the winter close, 21:00 UTC), so there is at least a
    # 30-minute buffer after close year-round without a DST-aware schedule (owner
    # decision 2026-07-04). :37 rather than :30 because GitHub queues every repo
    # cron globally and :00/:30 are its most congested minutes; see
    # market-overview.yml for the incident that prompted that.
    - cron: "37 21 * * 1-5"
    # Weekly, the whole market. Sunday 21:17 UTC, which is Sunday afternoon in
    # US Pacific (14:17 PDT, 13:17 PST). Markets are closed, so every part
    # carries the same Friday close, which makes the whole-market universe
    # internally consistent rather than smeared across a week of closes. Sunday
    # is otherwise empty: the constituent sync is Saturday 23:17 and Market
    # Overview runs weekdays only, so this never queues behind anything.
    - cron: "17 21 * * 0"
  workflow_dispatch:
    inputs:
      parts:
        description: "Comma-separated part numbers to run (blank = every part in the index)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: screener-data    # shared with the other data workflows so cross-workflow pushes never race
  cancel-in-progress: false

jobs:
  # The index is the single source of truth for how many parts exist, so the
  # matrix is read from it rather than hard-coded and left to drift.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      # Which parts the curated universes occupy is read from the index rather
      # than hardcoded, because sticky assignment can put a newly added index
      # member in a high part; see build_universe.py --parts-for.
      - id: curated
        name: Find the parts the curated universes live in
        run: |
          parts=$(python scripts/build_universe.py --parts-for "$CURATED_LISTS")
          echo "Curated universes span parts: $parts"
          echo "parts=$parts" >> "$GITHUB_OUTPUT"
        env:
          CURATED_LISTS: nasdaq100,sp500,growth,value,dividend,intl

      - id: plan
        name: Decide which parts this run covers
        env:
          REQUESTED: ${{ inputs.parts }}
          SCHEDULE: ${{ github.event.schedule }}
          CURATED: ${{ steps.curated.outputs.parts }}
          DAILY_CRON: "37 21 * * 1-5"
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          with open("data/stocks/index.json", encoding="utf-8") as f:
              parts = list(range(1, len(json.load(f)["parts"]) + 1))

          def nums(s):
              return [int(x) for x in s.replace(",", " ").split() if x.strip()]

          requested = nums(os.environ.get("REQUESTED", ""))
          schedule = os.environ.get("SCHEDULE", "")
          if requested:
              chosen, why = requested, "requested by hand"
          elif schedule == os.environ["DAILY_CRON"]:
              # The daily run deliberately skips the whole-market tail.
              chosen, why = nums(os.environ.get("CURATED", "")), "daily: curated universes"
          else:
              # The weekly cron, and a manual run with no input, cover everything.
              chosen, why = parts, "weekly: whole market"
          missing = [p for p in chosen if p not in parts]
          if missing:
              raise SystemExit(f"part(s) {missing} are not in the index (have {parts})")
          if not chosen:
              raise SystemExit("no parts chosen; refusing to run an empty matrix")
          print("matrix=" + json.dumps({"part": chosen}))
          print("why=" + why)
          PY
          cat "$GITHUB_OUTPUT"

  part:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # one bad part must not cancel the others
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
      max-parallel: 4
    steps:
      # Full history: `git pull --rebase` in the retry loop below is unreliable
      # on the default shallow clone.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch part ${{ matrix.part }}
        run: |
          pip install --quiet yfinance==1.4.1
          python scripts/fetch_screener_data.py --part ${{ matrix.part }}

      - name: Commit part ${{ matrix.part }}
        run: |
          part=$(printf "part-%02d.json" ${{ matrix.part }})
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/stocks/$part"
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update stock data ($part) [skip ci]"
          # Parallel legs push to the same branch, so a rejected push is
          # expected rather than an error. Rebase onto whatever landed first and
          # try again; only our own file is touched, so this never conflicts.
          for attempt in 1 2 3 4 5 6; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            sleep $(( (RANDOM % 15) + 3 ))
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push $part after 6 attempts."
          exit 1

  # Derived, not fetched. Must wait for every part, because one list can span
  # several parts (sp500 spans parts 1 and 2 today).
  feeds:
    needs: part
    if: ${{ !cancelled() }}     # a single failed part still leaves the other feeds derivable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Derive the per-list feeds from the parts
        run: python scripts/build_legacy_feeds.py

      - name: Commit feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.json data/screener_sp500.json data/screener_gvd.json data/screener_intl.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: derive screener feeds from stock parts [skip ci]"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            sleep $(( (RANDOM % 10) + 3 ))
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push the derived feeds after 3 attempts."
          exit 1
