name: Update Screener Data (Growth, Value & Dividend)

# Refresh of data/screener_gvd.json, the combined feed for the screener's
# Growth (top 100 VUG holdings), Value (top 100 VTV holdings), and Dividend
# (top 100 VIG holdings) universes. Runs Mon-Fri (trading days), 30 minutes
# AFTER the S&P 500 job, at 23:00 UTC. The three lists overlap heavily, so the
# fetch deduplicates symbols (~220 unique of 300) and runs in one pass. Shares
# the "screener-data" concurrency group so it never pushes at the same time as
# the other data jobs or the constituent sync.

on:
  schedule:
    - cron: "12 23 * * 1-5"   # 30 min after the S&P 500 run, Mon-Fri (off-peak minute; see market-overview.yml)
  workflow_dispatch: {}      # allow manual runs (use this to seed the feed the first time)

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch screener data
        run: |
          pip install --quiet yfinance==1.4.1
          python scripts/fetch_screener_data.py --combined growth=data/vug.json --combined value=data/vtv.json --combined dividend=data/vig.json --out data/screener_gvd.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_gvd.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update screener data (Growth, Value & Dividend) [skip ci]"
            git push
          fi
