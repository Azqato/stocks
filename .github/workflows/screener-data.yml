name: Update Screener Data (Nasdaq 100)

# Daily refresh of data/screener.json for the Nasdaq 100 screener (the default
# view). Runs FIRST, first in the whole chain, so the most-used view always
# refreshes promptly and never waits on the larger fetches.
# Uses yfinance (public Yahoo Finance data) -- no API key, no per-symbol
# subscription limits, so the whole list is refreshed every run.

on:
  schedule:
    # 21:30 UTC, Mon-Fri only (trading days). GitHub cron is UTC-only and does
    # not follow US daylight saving time, so this is deliberately anchored to
    # the LATEST possible US market close in UTC terms rather than a fixed
    # Eastern-clock offset (owner decision 2026-07-04, no DST-aware schedule):
    # the close is always 4:00pm US Eastern, which is 21:00 UTC in winter
    # (EST, UTC-5) but only 20:00 UTC in summer (EDT, UTC-4) -- winter is
    # "later" in UTC. Anchoring 30 minutes after the winter close (21:30 UTC)
    # guarantees at least a 30-minute buffer after close year-round: exactly
    # 30 minutes in winter, a full 90 minutes in summer.
    # :37 not :30 -- GitHub's scheduler queues all repos' crons globally, so
    # :00/:30 are its most congested minutes and jobs there get delayed or
    # dropped (see market-overview.yml for the incident that prompted this).
    - cron: "37 21 * * 1-5"
  workflow_dispatch: {}   # allow manual runs

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch screener data
        run: |
          pip install --quiet yfinance==1.4.1
          python scripts/fetch_screener_data.py --list data/nasdaq100.json --out data/screener.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update screener data (Nasdaq 100) [skip ci]"
            git push
          fi
