name: Update Financial Statements

# Builds data/statements/<TICKER>.json: income statement, balance sheet, and
# cash flow (TTM plus the last three fiscal years). Read by Automate
# Fundamentals' Research page (RS3). Uses yfinance, like the screener feeds.
#
# Rolling, not per-list (v5.2.0). The job used to run once a week over the five
# curated US lists, about 520 symbols, which left the roughly 3,050 stocks in
# the master universe outside those lists with no statements at all. It now runs
# every night over the universe with --oldest-first, taking the N symbols whose
# files are missing or oldest, so each stock comes round on a fixed cycle and a
# newly added ticker is picked up the very next night (a missing file sorts
# ahead of every existing one).
#
# N is 1000 a night (owner decision 2026-10-11), a 3.6-day cycle at 3,577
# stocks. It is a policy choice, not a constraint: measured 2026-10-10, 520
# symbols took 20m01s, so about 2.1 seconds a symbol including the 0.8s
# politeness pause, which put 1000 at roughly 37 minutes. Measured directly
# 2026-10-11 at the new count: 36m18s, 995/1000 files written, a fifth of the
# timeout below. The ceiling is near 5,000 and the whole universe would fit in
# one night at about 127 minutes, but statements only change when a company
# reports, so a nightly full pass would re-download an identical file about 90
# times a quarter. 1000 keeps the pickup lag under four days through earnings
# season at 2x the request budget rather than 7x.
#
# The separate weekly curated run is gone rather than kept alongside: it would
# refetch 520 symbols the rolling pass already covers and guarantee nothing the
# rolling pass does not. Statements change once a quarter, so a 6.9-day cycle is
# well inside the data's own refresh rate.

on:
  schedule:
    # 02:17 UTC daily. Picked to sit clear of every other job in the repo:
    # Market Overview runs 13:47, 17:07 and 21:07, stock data 21:37 weekdays and
    # 21:17 Sunday, the constituent sync Saturday 23:17, and the ETFs feed in the
    # evening. 02:17 is the only window with nothing on either side of it.
    # Off-peak minute rather than :00 or :15; see market-overview.yml for why.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: "How many of the oldest symbols to refresh (blank = 1000)"
        required: false
        default: ""
      lists:
        description: "Space-separated list files to run instead of the rolling universe pass"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: statements
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Full history: the rebase in the push retry loop below is unreliable on
      # the default shallow clone. Same reason as stock-data.yml.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch statements
        env:
          COUNT: ${{ inputs.count }}
          LISTS: ${{ inputs.lists }}
        run: |
          pip install --quiet yfinance==1.4.1
          if [ -n "$LISTS" ]; then
            python scripts/fetch_statements.py $LISTS
          else
            python scripts/fetch_statements.py --universe --oldest-first "${COUNT:-1000}"
          fi

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/statements
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update financial statements [skip ci]"
          # This job is in its own concurrency group, so a push can be rejected
          # by any of the data workflows landing a commit first. fetch_statements
          # had no retry loop until v5.2.0, which made the choice of time slot
          # delicate: a rejected push threw away an hour of fetching. Rebase and
          # retry instead; only data/statements is touched, so this never
          # conflicts. Same loop as stock-data.yml.
          for attempt in 1 2 3 4 5 6; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            sleep $(( (RANDOM % 15) + 3 ))
            git pull --rebase --autostash origin main
          done
          echo "::error::Could not push the statements after 6 attempts."
          exit 1
