name: Update Financial Statements

# Weekly refresh of data/statements/<TICKER>.json: income statement, balance
# sheet, and cash flow (TTM plus the last three fiscal years) for every US stock
# in the screener lists. Read by Automate Fundamentals' Research page (RS3).
# Statements change once a quarter, so weekly is plenty. Uses yfinance, like the
# screener feeds. About 520 symbols; roughly an hour.

on:
  schedule:
    # Saturday 14:17 UTC: markets are closed and the weekday feed runs are done.
    # Off-peak minute; see market-overview.yml.
    - cron: "17 14 * * 6"
  workflow_dispatch: {}   # allow manual runs

permissions:
  contents: write

concurrency:
  group: statements
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch statements
        run: |
          pip install --quiet yfinance==1.4.1
          python scripts/fetch_statements.py data/nasdaq100.json data/sp500.json data/vug.json data/vtv.json data/vig.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/statements
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update financial statements [skip ci]"
            git pull --rebase
            git push
          fi
