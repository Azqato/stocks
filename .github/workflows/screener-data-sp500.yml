name: Update Screener Data (S&P 500)

# Refresh of data/screener_sp500.json for the screener's "Expand to S&P 500"
# view. Runs 30 minutes AFTER the ETFs job (22:30 UTC), 60 minutes after the
# Nasdaq 100 job. This larger ~500-symbol fetch takes ~20 minutes.
# Shares the "screener-data" concurrency group so it never pushes at the same
# time as the Nasdaq job or the constituent sync.

on:
  schedule:
    - cron: "42 22 * * 1-5"   # 30 min after the ETFs run, Mon-Fri (off-peak minute; see market-overview.yml)
  workflow_dispatch: {}      # allow manual runs (use this to seed the feed the first time)

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch screener data
        run: |
          pip install --quiet yfinance==1.4.1
          python scripts/fetch_screener_data.py --list data/sp500.json --out data/screener_sp500.json

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/screener_sp500.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update screener data (S&P 500) [skip ci]"
            git push
          fi
