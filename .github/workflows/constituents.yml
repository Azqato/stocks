name: Update Constituents

# Weekly sync of the screener's constituent lists: data/nasdaq100.json (from
# Nasdaq's index API) and data/sp500.json (from State Street's published SPY
# holdings), each with a slickcharts fallback -- see update_constituents.py for
# why Wikipedia was dropped. Plus data/vug.json,
# data/vtv.json, data/vig.json, data/vxus.json with the top 100 holdings of
# the matching Vanguard ETFs (from Vanguard's holdings API, which publishes
# monthly). VXUS holdings are additionally resolved from ISIN to a suffixed
# Yahoo symbol via data/vxus_map.json (see update_etf_constituents.py). For
# whichever list's membership changed, regenerates the matching data feed and
# commits the lists + feeds. Runs Saturday, when the daily screener-data jobs
# are idle (those run Mon-Fri only, 21:30-23:30 UTC, entirely same-calendar-day
# as of the 2026-07-04 schedule; 23:00 UTC Saturday is clear of all of them).

on:
  schedule:
    - cron: "17 23 * * 6"   # Saturdays 23:17 UTC (weekday data jobs are idle; off-peak minute, see market-overview.yml)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screener-data    # share the data workflow's group so commits never race
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install sync dependencies
        run: |
          # openpyxl: reads State Street's SPY holdings .xlsx (the S&P 500 source).
          pip install --quiet requests pandas lxml openpyxl

      # The two syncs are separate steps, and the ETF one is allowed to fail
      # without failing the job, because they draw on unrelated third-party
      # sources. They shared one step until 2026-09-21, which meant Vanguard's
      # retired endpoint aborted the step AFTER the index sync had succeeded,
      # so the commit step was skipped and six weeks of good index updates
      # were silently thrown away. A broken source should now cost only its
      # own lists. The job still surfaces the breakage: the guard step below
      # fails the run once the good lists are committed.
      - name: Sync index constituent lists (Nasdaq 100, S&P 500)
        run: python scripts/update_constituents.py

      - name: Sync ETF holdings lists (VUG, VTV, VIG, VXUS)
        id: etf_sync
        continue-on-error: true
        run: python scripts/update_etf_constituents.py

      # Runs after both syncs and before the feed regeneration, so a membership
      # change reaches the part index in the same commit as the lists. New
      # tickers get the lowest-numbered part with room; existing tickers keep
      # their part, so the parts do not reshuffle and each part file's git
      # history stays a clean per-stock series.
      - name: Rebuild the master universe part index
        run: python scripts/build_universe.py

      # Rebuilt here rather than left to Monday so a list that changed on
      # Saturday has data for its new tickers before the next trading day. Only
      # the parts that gained tickers are refetched, which on a normal week is
      # one part or none at all; build_universe.py reports them.
      - name: Rebuild the universe and refetch only what changed
        run: |
          pip install --quiet yfinance==1.4.1
          if git diff --quiet data/nasdaq100.json data/sp500.json data/vug.json \
             data/vtv.json data/vig.json data/vxus.json data/vti.json \
             data/vxus_map.json; then
            echo "Constituents unchanged; nothing to do."
            exit 0
          fi
          parts=$(python scripts/build_universe.py --changed-parts)
          python scripts/build_universe.py
          if [ -n "$parts" ]; then
            echo "Parts gaining tickers: $parts"
            for p in $parts; do
              python scripts/fetch_screener_data.py --part "$p"
            done
          else
            echo "Membership moved but no part gained a ticker; feeds only."
          fi
          python scripts/build_legacy_feeds.py
          git add data/nasdaq100.json data/sp500.json data/vug.json data/vtv.json \
                  data/vig.json data/vxus.json data/vti.json data/vxus_map.json \
                  data/stocks data/screener.json data/screener_sp500.json \
                  data/screener_gvd.json data/screener_intl.json
          if git diff --staged --quiet; then
            echo "Nothing staged after the rebuild."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update index constituents [skip ci]"
          git push

      # Runs after the commit so a broken ETF source still turns the run red
      # (and still sends the Actions failure notification) without costing the
      # index updates that did work.
      - name: Fail if the ETF holdings sync failed
        if: steps.etf_sync.outcome == 'failure'
        run: |
          echo "::error::update_etf_constituents.py failed; the ETF holdings lists (vug/vtv/vig/vxus) are stale. Index lists were synced and committed normally."
          exit 1
